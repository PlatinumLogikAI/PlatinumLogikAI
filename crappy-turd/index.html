<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crappy Turd — Flap the Sewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --sky-top: #8ecae6;
    --sky-bottom: #b8e3d6;
    --tile-light: #f1faf7;
    --tile-dark: #cfe9df;
    --grate: #384c46;
    --pipe-body: #4f8a5b;
    --pipe-body-dark: #396745;
    --pipe-highlight: #7fbf8c;
    --brown: #7a4a26;
    --brown-dark: #5c3719;
    --gold: #ffd700;
    --ink: #1c2321;
    --paper-bg: #fffaf0;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    background: radial-gradient(circle at 50% 20%, #2f6f6a, #163331 70%);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .game-wrap {
    position: relative;
    width: min(94vw, 420px);
    aspect-ratio: 400 / 600;
    filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.45));
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 16px;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    touch-action: none;
    cursor: pointer;
  }

  .icon-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 5;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid rgba(0, 0, 0, 0.25);
    background: rgba(255, 255, 255, 0.75);
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover { background: #fff; }
  .icon-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px 18px;
    background: linear-gradient(rgba(12, 28, 26, 0.72), rgba(12, 28, 26, 0.86));
    color: var(--paper-bg);
  }
  .overlay.visible { display: flex; }

  .title {
    font-size: clamp(28px, 8vw, 40px);
    color: var(--gold);
    text-shadow: 3px 3px 0 #000;
    margin: 0;
    line-height: 1.3;
  }
  .title .icon { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(6deg); } }

  .tagline {
    font-size: 10px;
    color: #cfe9df;
    margin: 0 0 6px;
    line-height: 1.6;
  }

  .stat {
    font-size: 12px;
    margin: 2px 0;
  }
  .stat.big {
    font-size: 16px;
    color: var(--gold);
  }
  .stat.new-record {
    color: #ffef9f;
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  .hint {
    font-size: 9px;
    color: #cfe9df;
    margin-top: 2px;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }

  button.game-btn {
    font-family: inherit;
    font-size: 11px;
    color: #fff;
    background: linear-gradient(180deg, var(--brown) 0%, var(--brown-dark) 100%);
    border: 2px solid #3a2210;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    box-shadow: 0 4px 0 #2a1508;
  }
  button.game-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2a1508; }
  button.game-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.game-btn.secondary {
    background: linear-gradient(180deg, #5b6b66 0%, #3f4b47 100%);
    border-color: #23302c;
    box-shadow: 0 4px 0 #1a231f;
  }

  @media (prefers-reduced-motion: reduce) {
    .title .icon { animation: none; }
    .stat.new-record { animation: none; }
  }
</style>
</head>
<body>
<div class="game-wrap">
  <canvas id="game" width="400" height="600" aria-label="Crappy Turd game canvas" role="img"></canvas>
  <div id="overlay" class="overlay"></div>
  <button id="muteBtn" class="icon-btn" aria-label="Toggle sound" type="button">🔊</button>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const muteBtn = document.getElementById('muteBtn');
  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  // ---------- Tunables ----------
  const GRAVITY = 0.32;
  const FLAP_VEL = -7.6;
  const BASE_PIPE_SPEED = 2.3;
  const MAX_PIPE_SPEED = 4.4;
  const BASE_PIPE_GAP = 190;
  const MIN_PIPE_GAP = 148;
  const PIPE_WIDTH = 62;
  const PIPE_SPACING = 250;
  const FLOOR_HEIGHT = 54;
  const FLOOR_TOP = HEIGHT - FLOOR_HEIGHT;
  const PICKUP_SIZE = 26;
  const PIPES_PER_PICKUP = 4;
  const SHIELD_INVULN_FRAMES = 45;
  const CHILI_FLAP_MULT = 1.28;
  const CHILI_DURATION_FRAMES = 210;
  const CHILI_MIN_PIPES = 12;
  const CHILI_MAX_PIPES = 18;
  const PLUNGER_MIN_SCORE = 8;
  const PLUNGER_CHANCE = 0.55;
  const PLUNGER_PEEK_FRAMES = 12;
  const PLUNGER_EXTEND_FRAMES = 30;
  const PLUNGER_HOLD_MIN = 30;
  const PLUNGER_HOLD_MAX = 60;
  const PLUNGER_IDLE_MIN = 40;
  const PLUNGER_IDLE_MAX = 140;
  const PLUNGER_PEEK_PX = 10;
  const PLUNGER_MAX_PX = 68;

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Sound (synthesized, no external assets) ----------
  const Sound = (() => {
    let ctxA = null;
    let muted = localStorage.getItem('ct_muted') === '1';
    function unlock() {
      if (!ctxA) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctxA = new AC();
      } else if (ctxA.state === 'suspended') {
        ctxA.resume();
      }
    }
    function tone(freq0, freq1, dur, type, gain0) {
      if (muted || !ctxA) return;
      const t0 = ctxA.currentTime;
      const osc = ctxA.createOscillator();
      const g = ctxA.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq0, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freq1, 1), t0 + dur);
      g.gain.setValueAtTime(gain0, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g).connect(ctxA.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    }
    function noise(dur, gain0) {
      if (muted || !ctxA) return;
      const bufferSize = Math.floor(ctxA.sampleRate * dur);
      const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      const src = ctxA.createBufferSource();
      src.buffer = buffer;
      const g = ctxA.createGain();
      g.gain.setValueAtTime(gain0, ctxA.currentTime);
      src.connect(g).connect(ctxA.destination);
      src.start();
    }
    return {
      flap() { unlock(); tone(260, 130, 0.09, 'square', 0.06); },
      score() { unlock(); tone(660, 880, 0.07, 'sine', 0.08); setTimeout(() => tone(880, 990, 0.09, 'sine', 0.07), 60); },
      milestone() {
        unlock();
        tone(523, 659, 0.08, 'sine', 0.09);
        setTimeout(() => tone(659, 784, 0.08, 'sine', 0.09), 70);
        setTimeout(() => tone(784, 988, 0.12, 'sine', 0.09), 140);
      },
      shield() { unlock(); tone(700, 1100, 0.06, 'sine', 0.07); setTimeout(() => tone(1100, 1400, 0.08, 'sine', 0.06), 50); },
      shieldBreak() { unlock(); tone(300, 120, 0.18, 'triangle', 0.07); noise(0.15, 0.03); },
      chili() { unlock(); tone(400, 900, 0.05, 'sawtooth', 0.08); setTimeout(() => tone(900, 600, 0.06, 'square', 0.05), 40); },
      plungerSquelch() { unlock(); tone(180, 90, 0.08, 'square', 0.05); noise(0.05, 0.02); },
      death() { unlock(); tone(420, 50, 0.55, 'sawtooth', 0.09); noise(0.4, 0.05); },
      toggleMuted() {
        muted = !muted;
        localStorage.setItem('ct_muted', muted ? '1' : '0');
        muteBtn.textContent = muted ? '🔇' : '🔊';
        return muted;
      },
      get muted() { return muted; },
    };
  })();
  muteBtn.textContent = Sound.muted ? '🔇' : '🔊';
  muteBtn.addEventListener('click', () => Sound.toggleMuted());

  // ---------- Particles ----------
  const particles = [];
  function spawnPuff(x, y, color) {
    for (let i = 0; i < 5; i++) {
      particles.push({
        type: 'puff', x, y, vx: -1 - Math.random() * 1.5, vy: (Math.random() - 0.5) * 1.5,
        life: 0, maxLife: 22 + Math.random() * 10, size: 4 + Math.random() * 4, color,
      });
    }
  }
  function spawnSplat(x, y) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 1.5 + Math.random() * 4;
      particles.push({
        type: 'splat', x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 1,
        life: 0, maxLife: 40 + Math.random() * 20, size: 3 + Math.random() * 5,
      });
    }
  }
  function spawnBurst(x, y, color) {
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 4;
      particles.push({
        type: 'splat', x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 1,
        life: 0, maxLife: 30 + Math.random() * 18, size: 3 + Math.random() * 4, color,
      });
    }
  }
  function spawnScorePop(x, y, text, color) {
    particles.push({ type: 'pop', x, y, vx: 0, vy: -0.8, life: 0, maxLife: 45, text: text || '+1', color: color || '#ffd700' });
  }
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      if (p.type === 'splat') p.vy += 0.15;
      if (p.life >= p.maxLife) particles.splice(i, 1);
    }
  }
  function drawParticles() {
    for (const p of particles) {
      const t = p.life / p.maxLife;
      if (p.type === 'puff') {
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = p.color || '#caa877';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - t * 0.4), 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'splat') {
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = p.color || '#5c3719';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - t * 0.6), 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'pop') {
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = p.color || '#ffd700';
        ctx.font = '16px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Ambient flies ----------
  const flies = Array.from({ length: 4 }, (_, i) => ({
    baseX: 40 + Math.random() * (WIDTH - 80),
    baseY: 60 + Math.random() * 140,
    phase: Math.random() * Math.PI * 2,
    speed: 0.015 + Math.random() * 0.01,
    radius: 18 + Math.random() * 20,
    wing: 0,
  }));
  function drawFlies(t) {
    ctx.fillStyle = '#222';
    for (const f of flies) {
      f.wing = Math.sin(t * 0.05 + f.phase * 5) > 0 ? 1 : 0.4;
      const x = f.baseX + Math.cos(t * f.speed + f.phase) * f.radius;
      const y = f.baseY + Math.sin(t * f.speed * 1.7 + f.phase) * (f.radius * 0.6);
      ctx.beginPath();
      ctx.ellipse(x, y, 2.4, 1.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = f.wing * 0.6;
      ctx.beginPath();
      ctx.ellipse(x - 2, y - 2, 2.6, 1.2, -0.4, 0, Math.PI * 2);
      ctx.ellipse(x + 2, y - 2, 2.6, 1.2, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Turd (player) ----------
  const turd = {
    x: WIDTH / 4,
    y: HEIGHT / 2,
    vel: 0,
    size: 46,
    rotation: 0,
    squash: 1,
    blinkTimer: 0,
    blinkFrames: 0,
    dead: false,
    shielded: false,
    invulnFrames: 0,
    chiliFrames: 0,
    reset() {
      this.y = HEIGHT / 2;
      this.vel = 0;
      this.rotation = 0;
      this.squash = 1;
      this.dead = false;
      this.shielded = false;
      this.invulnFrames = 0;
      this.chiliFrames = 0;
      this.blinkTimer = 90 + Math.random() * 120;
      this.blinkFrames = 0;
    },
    flap() {
      this.vel = FLAP_VEL * (this.chiliFrames > 0 ? CHILI_FLAP_MULT : 1);
      this.squash = 1.25;
      spawnPuff(this.x - this.size * 0.3, this.y + this.size * 0.3);
      Sound.flap();
    },
    blink() { this.blinkFrames = 6; },
    tickBlink() {
      if (this.blinkTimer <= 0) {
        if (this.blinkFrames === 0) { this.blinkFrames = 6; this.blinkTimer = 90 + Math.random() * 150; }
      } else this.blinkTimer--;
      if (this.blinkFrames > 0) this.blinkFrames--;
    },
    update() {
      this.vel += GRAVITY;
      this.y += this.vel;
      this.rotation = Math.max(-0.5, Math.min(1.1, this.vel / 12));
      this.squash += (1 - this.squash) * 0.2;
      if (this.y - this.size / 2 < 0) { this.y = this.size / 2; this.vel = Math.abs(this.vel) * 0.4; }
      if (this.invulnFrames > 0) this.invulnFrames--;
      if (this.chiliFrames > 0) {
        this.chiliFrames--;
        if (t % 3 === 0) spawnPuff(this.x - this.size * 0.3, this.y + this.size * 0.25, '#ff6a2f');
      }
    },
    draw(idleBob) {
      const drawY = idleBob !== undefined ? idleBob : this.y;
      const s = this.size;
      ctx.save();
      ctx.translate(this.x, drawY);
      ctx.rotate(idleBob !== undefined ? 0 : this.rotation);
      ctx.scale(1 / this.squash, this.squash);

      if (this.invulnFrames > 0 && Math.floor(t / 3) % 2 === 0) ctx.globalAlpha = 0.4;

      // drop shadow
      ctx.beginPath();
      ctx.ellipse(0, s * 0.55, s * 0.4, s * 0.12, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fill();

      // hand-drawn body (not the browser's emoji glyph): its exact color and
      // proportions vary across platforms enough to break pixel-aligned
      // details like the eyes below, so we own every pixel instead.
      ctx.fillStyle = '#7a4a26';
      ctx.beginPath(); ctx.ellipse(0, s * 0.28, s * 0.40, s * 0.26, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, s * 0.02, s * 0.32, s * 0.24, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -s * 0.22, s * 0.22, s * 0.18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 0.04, -s * 0.40, s * 0.11, s * 0.10, 0.3, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#9c6a3e';
      ctx.beginPath();
      ctx.ellipse(-s * 0.10, s * 0.28, s * 0.14, s * 0.09, -0.3, 0, Math.PI * 2);
      ctx.fill();

      const eyeY = -s * 0.02;
      const eyeDX = s * 0.13;
      if (this.blinkFrames > 0) {
        ctx.strokeStyle = '#2b1a0e';
        ctx.lineWidth = s * 0.035;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-eyeDX - s * 0.06, eyeY);
        ctx.lineTo(-eyeDX + s * 0.06, eyeY);
        ctx.moveTo(eyeDX - s * 0.06, eyeY);
        ctx.lineTo(eyeDX + s * 0.06, eyeY);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(-eyeDX, eyeY, s * 0.085, s * 0.10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(eyeDX, eyeY, s * 0.085, s * 0.10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1c130a';
        ctx.beginPath(); ctx.arc(-eyeDX, eyeY + s * 0.02, s * 0.04, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(eyeDX, eyeY + s * 0.02, s * 0.04, 0, Math.PI * 2); ctx.fill();
      }

      ctx.strokeStyle = '#2b1a0e';
      ctx.lineWidth = s * 0.045;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, s * 0.10, s * 0.16, Math.PI * 0.12, Math.PI * 0.88);
      ctx.stroke();

      ctx.globalAlpha = 1;
      if (this.shielded) {
        const r = s * 0.62 + Math.sin(t * 0.15) * 2;
        ctx.strokeStyle = 'rgba(200,230,255,0.4)';
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      }
      if (this.chiliFrames > 0) {
        const r2 = s * 0.58 + Math.sin(t * 0.3) * 2;
        ctx.strokeStyle = 'rgba(255,120,40,0.7)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, r2, 0, Math.PI * 2); ctx.stroke();
      }

      ctx.restore();
    },
    get rect() {
      const pad = this.size * 0.32;
      return { x: this.x - this.size / 2 + pad, y: this.y - this.size / 2 + pad, w: this.size - pad * 2, h: this.size - pad * 2 };
    },
  };

  // ---------- Pipes (sewer-plumbing reskin) ----------
  function makePipe(x, gap) {
    const margin = 46;
    const pipe = {
      x,
      gap,
      top: margin + Math.random() * (FLOOR_TOP - gap - margin * 2),
      passed: false,
      plunger: null,
    };
    pipesSincePlunger++;
    if (score >= PLUNGER_MIN_SCORE && pipesSincePlunger >= 2 && Math.random() < PLUNGER_CHANCE) {
      pipe.plunger = {
        side: Math.random() < 0.5 ? 'top' : 'bottom',
        phase: 'idle',
        timer: 0,
      };
      pipesSincePlunger = 0;
    }
    return pipe;
  }
  // Idle->peek is triggered by the pipe's proximity to the turd (not a
  // fixed delay since spawn) so the dangerous phase reliably lines up with
  // the pipe actually being reachable, regardless of current scroll speed -
  // a time-based idle delay could otherwise fire after the pipe had already
  // scrolled past the player.
  function updatePlunger(p) {
    const pl = p.plunger;
    if (pl.phase === 'idle') {
      if (p.x <= turd.x + 250) { pl.phase = 'peek'; pl.timer = PLUNGER_PEEK_FRAMES; Sound.plungerSquelch(); }
      return;
    }
    pl.timer--;
    if (pl.timer > 0) return;
    if (pl.phase === 'peek') { pl.phase = 'extend'; pl.timer = PLUNGER_EXTEND_FRAMES; }
    else if (pl.phase === 'extend') { pl.phase = 'hold'; pl.timer = PLUNGER_HOLD_MIN + Math.random() * (PLUNGER_HOLD_MAX - PLUNGER_HOLD_MIN); }
    else if (pl.phase === 'hold') { pl.phase = 'retract'; pl.timer = PLUNGER_EXTEND_FRAMES; }
    else { pl.phase = 'done'; pl.timer = Infinity; }
  }
  function plungerExtentPx(pl) {
    if (!pl || pl.phase === 'idle' || pl.phase === 'done') return 0;
    if (pl.phase === 'peek') return PLUNGER_PEEK_PX;
    if (pl.phase === 'hold') return PLUNGER_MAX_PX;
    const prog = pl.phase === 'extend' ? 1 - pl.timer / PLUNGER_EXTEND_FRAMES : pl.timer / PLUNGER_EXTEND_FRAMES;
    return PLUNGER_PEEK_PX + prog * (PLUNGER_MAX_PX - PLUNGER_PEEK_PX);
  }
  function plungerRect(p) {
    if (!p.plunger) return null;
    const ext = plungerExtentPx(p.plunger);
    if (ext <= PLUNGER_PEEK_PX) return null;
    if (p.plunger.side === 'top') return { x: p.x, y: p.top, w: PIPE_WIDTH, h: ext };
    return { x: p.x, y: p.top + p.gap - ext, w: PIPE_WIDTH, h: ext };
  }
  function lerpColor(hexA, hexB, t) {
    const a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
    const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    const r = Math.round(ar + (br - ar) * t), g = Math.round(ag + (bg - ag) * t), bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
  }
  function drawPipeSegment(x, y, w, h, flip, warn) {
    // pipes gradually redden as the run gets harder - a visible tell for
    // the difficulty ramp, not just an unexplained speed-up. Chili adds a
    // pulsing flash on top, and an active plunger darkens just its side.
    const chiliFlash = turd.chiliFrames > 0 ? (0.5 + Math.sin(t * 0.4) * 0.5) * 0.6 : 0;
    const heat = Math.min(score / 35 + chiliFlash + (warn ? 0.25 : 0), 1);
    const capH = 22;
    const bodyGrad = ctx.createLinearGradient(x, 0, x + w, 0);
    bodyGrad.addColorStop(0, lerpColor('#396745', '#6e2f22', heat));
    bodyGrad.addColorStop(0.45, lerpColor('#4f8a5b', '#9c4530', heat));
    bodyGrad.addColorStop(0.55, lerpColor('#63a06f', '#c25b3f', heat));
    bodyGrad.addColorStop(1, lerpColor('#396745', '#6e2f22', heat));
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(x, y, w, h);

    const capY = flip ? y + h - capH : y;
    ctx.fillStyle = lerpColor('#2f5238', '#5c2418', heat);
    ctx.fillRect(x - 5, capY, w + 10, capH);
    const capGrad = ctx.createLinearGradient(x - 5, 0, x + w + 5, 0);
    capGrad.addColorStop(0, lerpColor('#43744f', '#7a3524', heat));
    capGrad.addColorStop(0.5, lerpColor('#7fbf8c', '#b06a4a', heat));
    capGrad.addColorStop(1, lerpColor('#43744f', '#7a3524', heat));
    ctx.fillStyle = capGrad;
    ctx.fillRect(x - 5, capY + 3, w + 10, capH - 6);

    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 5, capY, w + 10, capH);
  }
  function drawPipe(p) {
    const plungerActive = p.plunger && p.plunger.phase !== 'idle' && p.plunger.phase !== 'done';
    const topWarn = !!(plungerActive && p.plunger.side === 'top');
    const botWarn = !!(plungerActive && p.plunger.side === 'bottom');
    if (p.top > 0) drawPipeSegment(p.x, 0, PIPE_WIDTH, p.top, true, topWarn);
    const bottomY = p.top + p.gap;
    if (FLOOR_TOP - bottomY > 0) drawPipeSegment(p.x, bottomY, PIPE_WIDTH, FLOOR_TOP - bottomY, false, botWarn);
    drawPlunger(p);
  }
  function drawPlunger(p) {
    if (!p.plunger) return;
    const ext = plungerExtentPx(p.plunger);
    if (ext <= 0) return;
    const cx = p.x + PIPE_WIDTH / 2;
    const stemW = 8;
    const tipY = p.plunger.side === 'top' ? p.top + ext : p.top + p.gap - ext;
    const stemY = p.plunger.side === 'top' ? p.top : tipY;
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(cx - stemW / 2, stemY, stemW, ext);
    ctx.fillStyle = '#c8402e';
    ctx.beginPath();
    ctx.ellipse(cx, tipY, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8f2418';
    ctx.beginPath();
    ctx.ellipse(cx, tipY + (p.plunger.side === 'top' ? -2 : 2), 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function pipeRects(p) {
    return [
      { x: p.x, y: 0, w: PIPE_WIDTH, h: p.top },
      { x: p.x, y: p.top + p.gap, w: PIPE_WIDTH, h: FLOOR_TOP - (p.top + p.gap) },
    ];
  }

  // ---------- Pickups (TP-roll shield) ----------
  function drawPickup(pu) {
    const bob = Math.sin(t * 0.08 + pu.seed) * 3;
    ctx.save();
    ctx.translate(pu.x, pu.y + bob);

    ctx.beginPath();
    ctx.ellipse(0, PICKUP_SIZE * 0.5, PICKUP_SIZE * 0.4, PICKUP_SIZE * 0.12, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, PICKUP_SIZE * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fdf8ef';
    ctx.fill();
    ctx.strokeStyle = '#d8cfc0';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(200,190,170,0.6)';
    ctx.lineWidth = 1;
    for (let r = PICKUP_SIZE * 0.16; r < PICKUP_SIZE * 0.48; r += PICKUP_SIZE * 0.11) {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, 0, PICKUP_SIZE * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = '#c9a98a';
    ctx.fill();

    ctx.restore();
  }
  function drawChili(pu) {
    const bob = Math.sin(t * 0.08 + pu.seed) * 3;
    ctx.save();
    ctx.translate(pu.x, pu.y + bob);
    ctx.rotate(-0.35);

    ctx.beginPath();
    ctx.ellipse(0, PICKUP_SIZE * 0.42, PICKUP_SIZE * 0.38, PICKUP_SIZE * 0.12, 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fill();

    ctx.fillStyle = '#c9321f';
    ctx.beginPath();
    ctx.ellipse(0, PICKUP_SIZE * 0.05, PICKUP_SIZE * 0.15, PICKUP_SIZE * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e85a3a';
    ctx.beginPath();
    ctx.ellipse(-PICKUP_SIZE * 0.05, -PICKUP_SIZE * 0.05, PICKUP_SIZE * 0.06, PICKUP_SIZE * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#3f7a34';
    ctx.beginPath();
    ctx.ellipse(0, -PICKUP_SIZE * 0.42, PICKUP_SIZE * 0.09, PICKUP_SIZE * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // ---------- Floor (bathroom tile) ----------
  function drawFloor() {
    const tile = 20;
    for (let x = 0; x < WIDTH; x += tile) {
      for (let row = 0; row < 2; row++) {
        const y = FLOOR_TOP + row * tile;
        const even = (Math.round(x / tile) + row) % 2 === 0;
        ctx.fillStyle = even ? '#f1faf7' : '#cfe9df';
        ctx.fillRect(x, y, tile, tile);
      }
    }
    drawWaterline();
  }
  // Traces the floor's actual kill-plane (FLOOR_TOP) so the danger zone
  // reads as water you fall into, not an arbitrary invisible boundary.
  function drawWaterline() {
    const wavelength = 42;
    const amp = 3;
    ctx.beginPath();
    ctx.moveTo(0, FLOOR_TOP + 10);
    for (let x = 0; x <= WIDTH; x += 8) {
      ctx.lineTo(x, FLOOR_TOP - 4 + Math.sin(x / wavelength + t * 0.05) * amp);
    }
    ctx.lineTo(WIDTH, FLOOR_TOP + 10);
    ctx.closePath();
    ctx.fillStyle = 'rgba(94, 178, 209, 0.32)';
    ctx.fill();

    ctx.beginPath();
    for (let x = 0; x <= WIDTH; x += 8) {
      const y = FLOOR_TOP - 4 + Math.sin(x / wavelength + t * 0.05) * amp;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(219, 247, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#2a4a52';
    ctx.fillRect(0, FLOOR_TOP + 8, WIDTH, 3);
  }

  // ---------- Game state ----------
  let state = 'start'; // start | ready | playing | paused | dying | gameover
  const READY_PIPE_GAP_BONUS = 26;
  let score = 0;
  let highScore = Number(localStorage.getItem('ct_high_score')) || 0;
  let pipes = [];
  let pickups = [];
  let pipesSincePickup = 0;
  let pipesSinceChili = 0;
  let nextChiliAt = CHILI_MIN_PIPES + Math.floor(Math.random() * (CHILI_MAX_PIPES - CHILI_MIN_PIPES + 1));
  let pipesSincePlunger = 99;
  let shake = { time: 0, mag: 0 };
  let t = 0;

  function difficultySpeed() { return Math.min(BASE_PIPE_SPEED + score * 0.035, MAX_PIPE_SPEED); }
  function difficultyGap() { return Math.max(BASE_PIPE_GAP - score * 1.1, MIN_PIPE_GAP); }

  function resetGame() {
    score = 0;
    turd.x = WIDTH / 4;
    turd.reset();
    pipesSincePlunger = 99;
    pipes = [makePipe(WIDTH + 400, BASE_PIPE_GAP + READY_PIPE_GAP_BONUS)];
    pickups = [];
    pipesSincePickup = 0;
    pipesSinceChili = 0;
    nextChiliAt = CHILI_MIN_PIPES + Math.floor(Math.random() * (CHILI_MAX_PIPES - CHILI_MIN_PIPES + 1));
    particles.length = 0;
    shake = { time: 0, mag: 0 };
  }

  function rectsCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function triggerShake(mag) { shake = { time: 16, mag }; }

  // Absorbs one hit if a shield is active; returns whether it was absorbed.
  function handleHit() {
    if (!turd.shielded) return false;
    turd.shielded = false;
    turd.invulnFrames = SHIELD_INVULN_FRAMES;
    turd.vel = -5;
    triggerShake(4);
    spawnBurst(turd.x, turd.y, '#ffffff');
    Sound.shieldBreak();
    return true;
  }

  function renderOverlay(html) {
    overlay.innerHTML = html;
    overlay.classList.add('visible');
  }
  function hideOverlay() { overlay.classList.remove('visible'); }

  function showStart() {
    state = 'start';
    turd.reset();
    renderOverlay(`
      <h1 class="title"><span class="icon">💩</span> CRAPPY TURD</h1>
      <p class="tagline">One log. Infinite pipes.<br>Zero dignity.</p>
      <p class="stat big">Best: ${highScore}</p>
      <div class="btn-row"><button id="startBtn" class="game-btn" type="button">PLOP IN ▶</button></div>
      <p class="hint">Tap, click, or press Space to flap<br>through the sewer pipes.</p>
    `);
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function startGame() {
    hideOverlay();
    resetGame();
    state = 'ready';
  }

  const DEATH_LINES = {
    plungerTop: "You got plunged.",
    plungerBottom: "You can't handle it.",
  };
  const GAME_OVER_DELAY_MS = 550;
  function endGame(reason) {
    if (state === 'dying' || state === 'gameover') return;
    state = 'dying'; // let the impact play out before the overlay covers it
    turd.dead = true;
    if (reason === 'floor') {
      spawnBurst(turd.x, FLOOR_TOP, '#bfe9fb');
    } else {
      spawnSplat(turd.x, turd.y);
    }
    triggerShake(7);
    Sound.death();
    setTimeout(() => showGameOver(reason), GAME_OVER_DELAY_MS);
  }
  function showGameOver(reason) {
    state = 'gameover';
    const isRecord = score > highScore;
    if (isRecord) {
      highScore = score;
      localStorage.setItem('ct_high_score', String(highScore));
    }
    const deathLine = DEATH_LINES[reason];
    renderOverlay(`
      <h1 class="title" style="font-size:22px;">🚽 FLUSHED! 🚽</h1>
      ${deathLine ? `<p class="hint">${deathLine}</p>` : ''}
      <p class="stat big">Score: ${score}</p>
      <p class="stat ${isRecord ? 'new-record' : ''}">${isRecord ? 'NEW RECORD! The plumber salutes you.' : 'Best: ' + highScore}</p>
      <div class="btn-row">
        <button id="restartBtn" class="game-btn" type="button">FLUSH AGAIN</button>
        <button id="quitBtn" class="game-btn secondary" type="button">BAIL OUT</button>
      </div>
    `);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('quitBtn').addEventListener('click', showStart);
  }

  function showPaused() {
    state = 'paused';
    renderOverlay(`
      <h1 class="title" style="font-size:22px;">⏸ PAUSED</h1>
      <p class="hint">The sewer waits for no one.<br>Come back when you're ready.</p>
      <div class="btn-row"><button id="resumeBtn" class="game-btn" type="button">RESUME</button></div>
    `);
    document.getElementById('resumeBtn').addEventListener('click', () => {
      hideOverlay();
      state = 'playing';
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') showPaused();
  });

  // ---------- Input ----------
  function handleFlapInput() {
    if (state === 'ready') state = 'playing';
    if (state === 'playing') turd.flap();
  }
  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' && e.code !== 'ArrowUp') return;
    e.preventDefault();
    handleFlapInput();
  });
  canvas.addEventListener('mousedown', handleFlapInput);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleFlapInput(); }, { passive: false });

  // ---------- Main loop ----------
  function update() {
    turd.update();

    if (turd.y + turd.size * 0.32 >= FLOOR_TOP) {
      turd.y = FLOOR_TOP - turd.size * 0.32;
      if (turd.invulnFrames <= 0) {
        if (!handleHit()) return endGame('floor');
      }
    }

    const speed = difficultySpeed();
    const last = pipes[pipes.length - 1];
    if (WIDTH - last.x >= PIPE_SPACING) {
      const newPipe = makePipe(last.x + PIPE_SPACING, difficultyGap());
      pipes.push(newPipe);
      pipesSincePickup++;
      pipesSinceChili++;
      const gapCenter = { x: newPipe.x + PIPE_WIDTH / 2, y: newPipe.top + newPipe.gap / 2 };
      if (pipesSincePickup >= PIPES_PER_PICKUP && pickups.length === 0) {
        pickups.push({ type: 'tp', x: gapCenter.x, y: gapCenter.y, seed: Math.random() * 10 });
        pipesSincePickup = 0;
      } else if (pipesSinceChili >= nextChiliAt && pickups.length === 0) {
        pickups.push({ type: 'chili', x: gapCenter.x, y: gapCenter.y, seed: Math.random() * 10 });
        pipesSinceChili = 0;
        nextChiliAt = CHILI_MIN_PIPES + Math.floor(Math.random() * (CHILI_MAX_PIPES - CHILI_MIN_PIPES + 1));
      }
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= speed;
      if (p.plunger) updatePlunger(p);
      if (p.x + PIPE_WIDTH < 0) { pipes.splice(i, 1); continue; }
      if (!p.passed && p.x + PIPE_WIDTH < turd.x) {
        p.passed = true;
        score++;
        turd.blink();
        if (score % 10 === 0) {
          spawnScorePop(turd.x, turd.y - 40, `🔥 ${score}!`, '#ff9d4d');
          spawnBurst(turd.x, turd.y, '#ffd700');
          triggerShake(3);
          Sound.milestone();
        } else {
          spawnScorePop(turd.x, turd.y - 40);
          Sound.score();
        }
      }
      if (turd.invulnFrames <= 0) {
        for (const r of pipeRects(p)) {
          if (rectsCollide(turd.rect, r)) { if (!handleHit()) return endGame(); }
        }
        const pr = plungerRect(p);
        if (pr && rectsCollide(turd.rect, pr)) {
          if (!handleHit()) return endGame(p.plunger.side === 'top' ? 'plungerTop' : 'plungerBottom');
        }
      }
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
      const pu = pickups[i];
      pu.x -= speed;
      if (pu.x < -30) { pickups.splice(i, 1); continue; }
      const dx = pu.x - turd.x, dy = pu.y - turd.y;
      if (Math.hypot(dx, dy) < turd.size * 0.42 + PICKUP_SIZE * 0.42) {
        pickups.splice(i, 1);
        if (pu.type === 'chili') {
          turd.chiliFrames = CHILI_DURATION_FRAMES;
          spawnBurst(pu.x, pu.y, '#ff6a2f');
          spawnScorePop(turd.x, turd.y - 40, 'SPICY!', '#ff8a4d');
          Sound.chili();
        } else {
          turd.shielded = true;
          spawnBurst(pu.x, pu.y, '#ffffff');
          spawnScorePop(turd.x, turd.y - 40, 'SHIELDED!', '#bfe7ff');
          Sound.shield();
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    let ox = 0, oy = 0;
    if (shake.time > 0 && !reduceMotion) {
      ox = (Math.random() - 0.5) * shake.mag;
      oy = (Math.random() - 0.5) * shake.mag;
      shake.time--;
      shake.mag *= 0.9;
    }
    ctx.save();
    ctx.translate(ox, oy);

    drawFlies(t);
    for (const p of pipes) drawPipe(p);
    drawFloor();
    for (const pu of pickups) { if (pu.type === 'chili') drawChili(pu); else drawPickup(pu); }

    if (state === 'start' || state === 'ready' || state === 'gameover') {
      const bob = state !== 'gameover' && !reduceMotion ? turd.y + Math.sin(t * 0.05) * 6 : turd.y;
      turd.draw(bob);
    } else {
      turd.draw();
    }

    if (state === 'ready') {
      const pulse = 0.85 + Math.sin(t * 0.08) * 0.15;
      ctx.globalAlpha = reduceMotion ? 1 : pulse;
      ctx.font = '14px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(12,28,26,0.85)';
      ctx.strokeText('TAP TO FLY', WIDTH / 2, HEIGHT / 2 + 90);
      ctx.fillStyle = '#ffd700';
      ctx.fillText('TAP TO FLY', WIDTH / 2, HEIGHT / 2 + 90);
      ctx.globalAlpha = 1;
    }

    drawParticles();

    ctx.fillStyle = '#0c1c1a';
    ctx.font = '20px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('💩 ' + score, 14, 14);

    ctx.restore();
  }

  function loop() {
    t++;
    turd.tickBlink();
    if (state === 'playing') update();
    updateParticles();
    draw();
    requestAnimationFrame(loop);
  }

  showStart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
